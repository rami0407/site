<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دخول المعلّم — مفتاح</title>
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="icon" href="../assets/logo.jpg">
<link rel="stylesheet" href="../site.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;800&display=swap');
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:'Noto Kufi Arabic',Tahoma,sans-serif;direction:rtl;color:#1d2b3a;background:linear-gradient(160deg,#4c1d95 0%,#6d28d9 45%,#7c3aed 100%);min-height:100vh;line-height:1.8}
.home{position:fixed;top:14px;right:14px;z-index:5;width:54px;height:54px;border-radius:16px;background:#fff;display:grid;place-items:center;font-size:28px;text-decoration:none;box-shadow:0 6px 18px #0003;border:0;cursor:pointer}
.home:hover{transform:scale(1.06)}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:84px 16px 32px}
.box{width:100%;max-width:440px;background:#fff;border-radius:26px;box-shadow:0 18px 50px #0004;padding:34px 26px;text-align:center}
.box img.logo{width:92px;height:92px;object-fit:contain;border-radius:20px}
.box h1{margin:10px 0 2px;font-size:28px;color:#5b21b6}
.box .sub{margin:0 0 22px;color:#5a6b7c;font-size:14px}
.f{text-align:right;margin:14px 0}
.f label{display:block;font-weight:700;margin-bottom:6px;font-size:16px}
.f input{font:inherit;font-size:18px;width:100%;border:2px solid #cfdbe7;border-radius:14px;padding:12px 14px;background:#f8fbfd;outline:none;transition:border-color .2s}
.f input:focus{border-color:#0b6bcb;background:#fff}
.f input.ltr{direction:ltr;text-align:left}
.go{font:inherit;font-weight:800;font-size:20px;width:100%;border:0;border-radius:16px;padding:14px;margin-top:16px;background:#ffcc33;color:#1d2b3a;cursor:pointer;box-shadow:0 4px 0 #d9a400;transition:all .15s}
.go:hover{background:#fed14c}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 #d9a400}
.go:disabled{opacity:.6;cursor:not-allowed}
.msg{min-height:28px;margin:12px 0 0;font-weight:700;color:#c0392b;font-size:14px}
</style>
</head>
<body>
<a class="home" href="../" title="صفحة الطالب" aria-label="صفحة الطالب">🎒</a>
<main class="center">
  <form class="box" id="f" novalidate autocomplete="off">
    <img class="logo" src="../assets/logo.jpg" onerror="this.onerror=null;this.src='https://musherfe.com/school_logo.png';" alt="شعار مدرسة مشيرفة">
    <h1>🧑‍🏫 دخول المعلّم</h1>
    <p class="sub">مفتاح — مدرسة مشيرفة الجماهيرية الابتدائية</p>

    <div class="f">
      <label for="em">البريد الإلكتروني</label>
      <input id="em" class="ltr" type="email" placeholder="example@mail.com" autocomplete="off" inputmode="email" maxlength="120" required>
    </div>
    
    <div class="f">
      <label for="pw">رمز الدخول السرّي</label>
      <input id="pw" class="ltr" type="password" placeholder="••••••••" autocomplete="new-password" maxlength="64" required>
    </div>

    <button class="go" id="go" type="submit">دخول</button>
    <p class="msg" id="m" role="alert"></p>
  </form>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var nxt = q.get('next') || 'home.html';
  if (!/^[A-Za-z0-9_\-\/.?=&%]*$/.test(nxt) || nxt.indexOf('//') === 0) nxt = 'home.html';
  
  // إذا كان مسجلاً مسبقاً بجلسة مصادق عليها
  try {
    var saved = JSON.parse(sessionStorage.getItem('miftah_user') || localStorage.getItem('miftah_user') || 'null');
    if (saved && saved.authenticated === true && saved.email) {
      location.replace(nxt);
      return;
    }
  } catch (_) {}

  var em = document.getElementById('em');
  var pw = document.getElementById('pw');
  var m = document.getElementById('m');
  var go = document.getElementById('go');

  if (em) em.value = '';
  if (pw) pw.value = '';

  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault();
    m.textContent = '';
    
    var emailVal = (em.value || '').trim().toLowerCase();
    var passVal = (pw.value || '').trim();

    if (!emailVal) {
      m.textContent = 'اكتبِ البريدَ الإلكترونيّ أولاً.';
      em.focus();
      return;
    }
    if (!passVal) {
      m.textContent = 'اكتبْ رمزَ الدخول السرّيّ.';
      pw.focus();
      return;
    }

    go.disabled = true;
    go.textContent = '⏳ جاري التحقق…';

    // التحقق من رمز الدخول (036301448 أو بريد المعلم)
    var authorizedCodes = ['036301448', 'rami0407@gmail.com'];
    var isAuthorized = authorizedCodes.includes(passVal) || 
                       (passVal === emailVal) || 
                       (emailVal === 'rami0407@gmail.com' && passVal === '036301448');

    if (!isAuthorized) {
      setTimeout(function () {
        go.disabled = false;
        go.textContent = 'دخول';
        m.textContent = '❌ رمزُ الدخول غير صحيح! الدخول مخصص للمعلمين فقط.';
        pw.value = '';
        pw.focus();
      }, 300);
      return;
    }

    // تسجيل الجلسة بنجاح
    var u = {
      name: emailVal.split('@')[0] || 'معلّم مشيرفة',
      email: emailVal,
      authenticated: true,
      role: 'owner',
      last_login: Date.now()
    };

    try {
      sessionStorage.setItem('miftah_user', JSON.stringify(u));
      localStorage.setItem('miftah_user', JSON.stringify(u));
    } catch (_) {}

    setTimeout(function () {
      location.replace(nxt);
    }, 150);
  });
})();
</script>
</body>
</html>
