<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دخول المعلّم — مفتاح</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/logo.jpg">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<a class="home" href="/" title="صفحة الطالب" aria-label="صفحة الطالب">🎒</a>
<main class="center">
  <form class="box" id="f" novalidate>
    <img class="logo" src="/assets/logo.jpg" alt="شعار المدرسة">
    <h1>🧑‍🏫 دخول المعلّم</h1>
    <p class="sub">مفتاح — مدرسة مشيرفة الجماهيرية الابتدائية</p>
    <div class="f"><label for="em">البريد الإلكتروني</label><input id="em" class="ltr" type="email" autocomplete="username" inputmode="email" maxlength="120"></div>
    <div class="f"><label for="pw">الرقم السري</label><input id="pw" class="ltr" type="password" autocomplete="current-password" maxlength="64"></div>
    <button class="go" id="go" type="submit">دخول</button>
    <p class="msg" id="m" role="alert"></p>
  </form>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search), nxt = q.get('next') || '';
  if (!/^\/[A-Za-z0-9_\-\/.?=&%]*$/.test(nxt) || nxt.indexOf('//') === 0) nxt = '/teacher/home.html';
  fetch('/api/auth/me').then(function (r) { if (r.ok) location.replace(nxt); });
  var em = document.getElementById('em'), pw = document.getElementById('pw'), m = document.getElementById('m'), go = document.getElementById('go');
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault(); m.textContent = '';
    if (!em.value.trim()) { m.textContent = 'اكتبِ البريدَ الإلكترونيّ.'; em.focus(); return; }
    if (!pw.value) { m.textContent = 'اكتبِ الرقمَ السرّيّ.'; pw.focus(); return; }
    go.disabled = true; go.textContent = '⏳ لحظة…';
    fetch('/api/auth/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ email: em.value, password: pw.value }) })
      .then(function (r) { return r.json(); }).then(function (r) {
        if (r.ok) { location.replace(nxt); return; }
        go.disabled = false; go.textContent = 'دخول'; m.textContent = r.error || 'تعذّر الدخول.'; pw.value = ''; pw.focus();
      }).catch(function () { go.disabled = false; go.textContent = 'دخول'; m.textContent = 'لا يوجد اتّصال. جرّبْ مرّةً أخرى.'; });
  });
})();
</script>
</body>
</html>
