<!DOCTYPE html>
<html>
<head>

  .wrapper { position: relative; width: 360px; }

    border-radius: 50%;

  .btn-reset {

    left: 58.5%;
    top: 57.5%;
    width: 10.5%;
    height: 9%;

    border: 2px solid #ff0000;
    box-sizing: border-box;

  }
  .lcd {
    position: absolute;
    left: 21%;
    top: 26.5%;
    width: 46%;
    height: 13.5%;
    border: 2px solid #0000ff;
    box-sizing: border-box;
  }
</style>
</head>
<body>
<div class="wrapper">
  <img src="tasbih_counter_clean.jpg">
