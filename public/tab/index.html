<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مفتاح | مدرسة مشيرفة الجماهيرية الابتدائية</title>
<meta name="description" content="«مفتاح» — اكتبِ اسمَك وكودَ الدخول من معلّمك وابدأ الحصّة.">
<meta property="og:title" content="مفتاح — ادخلْ إلى حصّتك">
<meta property="og:description" content="اكتبْ اسمَك وكودَ الدخول الذي أرسله معلّمك.">
<meta property="og:image" content="https://musherfe.com/school_logo.png">
<link rel="icon" href="assets/logo.jpg">
<link rel="stylesheet" href="site.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;600;800&display=swap');
*{box-sizing:border-box}html,body{margin:0;min-height:100%}
body{font-family:'Noto Kufi Arabic',Tahoma,sans-serif;direction:rtl;color:#1d2b3a;background:linear-gradient(160deg,#1b5e3a 0%,#2f855a 38%,#0b6bcb 100%);min-height:100vh;line-height:1.8}
.home{position:fixed;top:14px;right:14px;z-index:5;width:54px;height:54px;border-radius:16px;background:#fff;display:grid;place-items:center;font-size:28px;text-decoration:none;box-shadow:0 6px 18px #0003;border:0;cursor:pointer}
.home:hover{transform:scale(1.06)}
.center{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:84px 16px 32px}
.box{width:100%;max-width:440px;background:#fff;border-radius:26px;box-shadow:0 18px 50px #0004;padding:28px 24px 26px;text-align:center}
.box img.logo{width:92px;height:92px;object-fit:contain;border-radius:20px}
.box h1{margin:6px 0 0;font-size:30px;color:#1b5e3a}
.box .sub{margin:0 0 18px;color:#5a6b7c;font-size:14px}
.f{text-align:right;margin:12px 0}
.f label{display:block;font-weight:700;margin-bottom:4px;font-size:17px}
.f input{font:inherit;font-size:20px;width:100%;border:2px solid #cfdbe7;border-radius:14px;padding:12px 14px;background:#f8fbfd;outline:none}
.f input:focus{border-color:#0b6bcb;background:#fff}
.f input.code{direction:ltr;text-align:center;letter-spacing:8px;font-size:28px;font-weight:800;text-transform:uppercase}
.f input.ltr{direction:ltr;text-align:left}
.go{font:inherit;font-weight:800;font-size:22px;width:100%;border:0;border-radius:16px;padding:14px;margin-top:10px;background:#ffcc33;color:#1d2b3a;cursor:pointer;box-shadow:0 4px 0 #d9a400}
.go:active{transform:translateY(2px);box-shadow:0 2px 0 #d9a400}.go:disabled{opacity:.6}
.msg{min-height:28px;margin:10px 0 0;font-weight:600;color:#c0392b}
.msg.ok{color:#2f855a}
</style>
</head>
<body>
<a class="home" href="teacher/login.html" title="دخول المعلّم" aria-label="دخول المعلّم">🏠</a>
<main class="center">
  <form class="box" id="f" novalidate autocomplete="off">
    <img class="logo" src="assets/logo.jpg" onerror="this.onerror=null;this.src='https://musherfe.com/school_logo.png';" alt="شعار مدرسة مشيرفة الجماهيرية الابتدائية">
    <h1>🔑 مفتاح</h1>
    <p class="sub">مدرسة مشيرفة الجماهيرية الابتدائية</p>
    <div class="f"><label for="nm">اسم الطالب</label><input id="nm" maxlength="30" autocomplete="off"></div>
    <div class="f"><label for="cd">كود الدخول</label><input id="cd" class="code" maxlength="6" autocapitalize="characters" spellcheck="false" inputmode="text"></div>
    <button class="go" id="go" type="submit">ادخل</button>
    <button type="button" id="my-portfolio-btn" style="display:block;width:100%;margin-top:10px;background:#eef5ff;color:#0b6bcb;border:1.5px solid #c9d6e4;padding:10px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer">📋 ملفّي التعليمي (سجل تقدّمي)</button>
    <p class="msg" id="m" role="alert"></p>
  </form>
</main>
<script>
(function () {
  var nm = document.getElementById('nm'), cd = document.getElementById('cd'), m = document.getElementById('m'), go = document.getElementById('go');
  try { nm.value = localStorage.getItem('manasa-name') || ''; } catch (_) {}
  var q = new URLSearchParams(location.search); if (q.get('code')) cd.value = q.get('code').toUpperCase();
  cd.addEventListener('input', function () { var p = cd.selectionStart; cd.value = cd.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); try { cd.setSelectionRange(p, p); } catch (_) {} });
  var apiBase = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') ? '' : '';
  function get(u) {
    var fullUrl = (u.startsWith('/api/') && apiBase) ? (apiBase + u) : u;
    return fetch(fullUrl).then(function (r) { return r.json().catch(function () { return { ok: false }; }); });
  }
  document.getElementById('f').addEventListener('submit', function (e) {
    e.preventDefault(); m.className = 'msg'; m.textContent = '';
    var name = nm.value.trim().replace(/\s+/g, ' '), code = cd.value.trim().toUpperCase();
    if (!name) { m.textContent = 'اكتبْ اسمَك أوّلًا.'; nm.focus(); return; }
    if (!code) { m.textContent = 'اكتبْ كودَ الدخول الذي أرسله معلّمك.'; cd.focus(); return; }
    if (!/^[A-Z0-9]{4,6}$/.test(code)) { m.textContent = 'كودُ الدخول غيرُ صحيح. تأكّدْ منه مع معلّمك.'; cd.focus(); return; }
    go.disabled = true; go.textContent = '⏳ لحظة…';
    function done(url) {
      try { var old = localStorage.getItem('manasa-name'); if (old !== name) localStorage.setItem('manasa-pid', Math.random().toString(36).slice(2, 10)); localStorage.setItem('manasa-name', name); } catch (_) {}
      location.href = url;
    }
    function fail(t) { go.disabled = false; go.textContent = 'ادخل'; m.textContent = t; cd.focus(); cd.select(); }

    // 1. فحص التخزين المحلي أولاً للدخول الفوري
    try {
      var locL = localStorage.getItem('manasa-lesson-' + code);
      var locS = localStorage.getItem('manasa-session-' + code);
      if (locL || locS) return done('manasa/lesson.html?c=' + encodeURIComponent(code) + '&go=1');
      var arch = JSON.parse(localStorage.getItem('miftah_archive_lessons') || '[]');
      if (arch.some(function (x) { return String(x.code || '').toUpperCase() === code; })) {
        return done('manasa/lesson.html?c=' + encodeURIComponent(code) + '&go=1');
      }
    } catch (_) {}

    // 2. فحص السحابة (Firestore) مباشرة عبر REST API لتعمل على جميع أجهزة الطلاب والواتساب
    fetch('https://firestore.googleapis.com/v1/projects/musheirifa-school/databases/(default)/documents/miftaah_manasa_lessons/' + encodeURIComponent(code))
      .then(function (r) {
        if (r.ok) return r.json();
        throw new Error('not_in_cloud');
      })
      .then(function (doc) {
        if (doc && doc.fields && doc.fields.json && doc.fields.json.stringValue) {
          try {
            var parsed = JSON.parse(doc.fields.json.stringValue);
            localStorage.setItem('manasa-lesson-' + code, JSON.stringify(parsed));
            localStorage.setItem('manasa-session-' + code, JSON.stringify({ code: code, lesson: code, title: parsed.title, lessonData: parsed }));
          } catch (_) {}
          return done('manasa/lesson.html?c=' + encodeURIComponent(code) + '&go=1');
        }
        throw new Error('empty');
      })
      .catch(function () {
        // 3. احتياط للروابط أو الجلسات الأخرى
        return done('manasa/lesson.html?c=' + encodeURIComponent(code) + '&go=1');
      });
  });

  var portBtn = document.getElementById('my-portfolio-btn');
  if (portBtn) {
    portBtn.onclick = function () {
      var name = (nm.value || localStorage.getItem('manasa-name') || '').trim();
      if (!name) { alert('اكتبْ اسمَك في الحقل أولاً لعرض ملفّك.'); nm.focus(); return; }
      var modal = document.getElementById('p-modal');
      if (!modal) {
        modal = document.createElement('div');
        modal.id = 'p-modal';
        modal.style.cssText = 'position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px);direction:rtl';
        document.body.appendChild(modal);
      }
      modal.style.display = 'flex';
      modal.innerHTML = '<div style="background:#fff;border-radius:20px;max-width:540px;width:100%;max-height:85vh;overflow-y:auto;padding:22px;position:relative;box-shadow:0 10px 40px rgba(0,0,0,0.2)">' +
        '<button id="close-pm" style="position:absolute;left:14px;top:14px;border:0;background:#eef2f6;border-radius:50%;width:36px;height:36px;font-size:18px;cursor:pointer">✕</button>' +
        '<div style="text-align:center;margin-bottom:14px"><div style="font-size:36px">📋</div><h2 style="margin:4px 0">ملف متابعة الطالب: ' + name + '</h2><p style="color:#64748b;margin:0;font-size:14px">سجل الحصص والإنجازات</p></div>' +
        '<div id="p-content"><p style="text-align:center;color:#64748b">⏳ جلب البيانات…</p></div></div>';
      document.getElementById('close-pm').onclick = function () { modal.style.display = 'none'; };
      modal.onclick = function (e) { if (e.target === modal) modal.style.display = 'none'; };

      var localRecs = [];
      try { localRecs = JSON.parse(localStorage.getItem('manasa-portfolio-' + name) || '[]'); } catch (_) {}
      fetch(apiBase + '/api/manasa/portfolio?name=' + encodeURIComponent(name))
        .then(function (r) { return r.json(); })
        .then(function (r) {
          var recs = (r && r.records && r.records.length) ? r.records : localRecs;
          var pc = document.getElementById('p-content');
          if (!pc) return;
          if (!recs.length) {
            pc.innerHTML = '<div style="text-align:center;padding:20px;color:#64748b"><p>لا توجد حصص مسجلة باسمك بعد.</p><p style="font-size:13px">عندما تدخل أي حصة باسمك وتتقدم فيها، ستُسجل نتائجك هنا تلقائيًا.</p></div>';
            return;
          }
          pc.innerHTML = '<div style="display:flex;gap:8px;margin-bottom:12px;justify-content:center"><span style="background:#e0f2fe;color:#0369a1;padding:4px 12px;border-radius:999px;font-weight:700;font-size:13px">📚 ' + recs.length + ' حصص</span><span style="background:#dcfce7;color:#15803d;padding:4px 12px;border-radius:999px;font-weight:700;font-size:13px">🌟 مكتملة: ' + recs.filter(function (x) { return x.done; }).length + '</span></div>' +
            recs.map(function (rc) {
              return '<div style="border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-bottom:10px;background:#f8fafc;text-align:right">' +
                '<div style="display:flex;justify-content:space-between"><b>📖 ' + (rc.title || 'حصة') + '</b><span style="color:#64748b;font-size:12px">' + (rc.date || '') + '</span></div>' +
                '<div style="margin:6px 0;font-size:13px"><span style="background:#e0f2fe;color:#0369a1;padding:2px 8px;border-radius:6px">المحطة: ' + (rc.station || 'م') + (rc.done ? ' ✓' : '') + '</span> ' + (rc.durationText ? '<span style="background:#f1f5f9;color:#334155;padding:2px 8px;border-radius:6px">⏱️ ' + rc.durationText + '</span> ' : '') + (rc.result ? '<span style="background:#dcfce7;color:#15803d;padding:2px 8px;border-radius:6px">' + (rc.result === 'a' ? 'حقق 🌟' : 'جزئي 🌱') + '</span>' : '') + '</div>' +
                (rc.harvest ? '<div style="font-size:13px;margin-top:6px;background:#fff;border:1px solid #cbd5e1;padding:8px;border-radius:8px;color:#1b5e3a"><b>الحصاد:</b> ' + (rc.harvest[0] || '—') + '</div>' : '') +
              '</div>';
            }).join('');
        }).catch(function () {
          var pc = document.getElementById('p-content');
          if (pc) pc.innerHTML = '<p style="text-align:center;color:#ef4444">تعذّر جلب البيانات حالياً.</p>';
        });
    };
  }
})();
</script>
</body>
</html>
